# Copied to .cargo/config.toml by build.sh: self-contained static linking, no system cross toolchain.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-self-contained=yes", "-C", "linker=rust-lld", "-C", "relocation-model=static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-self-contained=yes", "-C", "linker=rust-lld", "-C", "relocation-model=static"]
