name: Tests

# The crate's tests, clippy and the smoke script on both architectures.  This
# is where a build error surfaces; the release workflows build again from the
# same sources.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Lint the workflow files and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the workflow files
        # actionlint checks the expressions and runs shellcheck over every `run:` block, the
        # releases Selkies' CI lints its own with, each checked against its SHA-256 (a version
        # bump takes the hash with it)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          curl -fsSL --retry 5 -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 5 -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" actionlint.tar.gz "${SHELLCHECK_SHA256}" shellcheck.tar.xz | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          tar -xJf shellcheck.tar.xz --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          PATH="${PWD}:${PATH}" ./actionlint -color
      - name: Lint the Steam installer and check
        run: |
          sh -n install-steam.sh
          bash -n tests/steam/check.sh
          ./shellcheck install-steam.sh tests/steam/check.sh

  windows-probe:
    name: Windows OpenGL probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cross-compile the program tests/steam/check.sh runs through Proton
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc -O2 -o wgltri.exe tests/steam/wgltri.c \
              -lopengl32 -lgdi32 -luser32 -mconsole
          file wgltri.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wgltri
          path: wgltri.exe

  cargo:
    name: cargo test (${{ matrix.target.arch }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - name: Native libraries for the probes
        # gcc-multilib on x86_64 builds the i386 stub probe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libudev-dev
          if [ "${{ matrix.target.arch }}" = x86_64 ]; then sudo apt-get install -y -qq gcc-multilib; fi

      - name: Build the 32-bit probes
        # i686 on x86_64, armv7 on aarch64: static musl through rust-lld, no cross toolchain
        run: |
          case "${{ matrix.target.arch }}" in
            x86_64) tests/probes/build.sh socketcall32 ;;
            aarch64) tests/probes/build.sh armtest ;;
          esac

      - name: Fetch a proot-apps rootfs
        run: scripts/fetch-rootfs.sh ghcr.io/linuxserver/proot-apps:debian-trixie rootfs

      - name: cargo build and test
        # Unit tests plus tests/e2e.rs, which drives the built binary through
        # the smoke script, a real rootfs, bwrap mode and the 32-bit probes
        env:
          PROOT_TEST_ROOTFS: ${{ github.workspace }}/rootfs
        run: cargo build && cargo test

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt

      - name: pre-commit
        # clippy builds the crate, which the cargo jobs do
        env:
          SKIP: clippy
        run: |
          python3 -m pip install "pre-commit==4.6.*"
          pre-commit run --all-files --show-diff-on-failure
