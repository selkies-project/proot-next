name: Pre-Release

# Every commit on main ships: the static binaries land on a pre-release named
# by the short commit hash, so proot-apps and the baseimages can pin a build
# between tagged releases.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: proot-*
          path: out
          merge-multiple: true

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Create pre-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.sha.outputs.short }}
          name: ${{ steps.sha.outputs.short }}
          # Tag this commit, not main's head by the time the build finished
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          prerelease: true
          files: out/*
