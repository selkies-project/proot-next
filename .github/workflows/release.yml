name: Release

# A tag push releases that tag.  The tag is a semantic version; a pre-release
# such as 0.2.0-rc1 is released as one.  Its notes come from
# release-notes/<tag>.md, or from the notes of the release it leads to.  A
# manual run releases the tag it names and decides the "Latest" badge.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish, tagging this run's commit when it is new (e.g. 0.2.0 or 0.2.0-rc1)
        type: string
        required: true
      latest:
        description: Designate this release as the latest; auto does so for a release and not for a pre-release
        type: choice
        options: [auto, always, never]
        default: auto

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      notes: ${{ steps.notes.outputs.path }}
    steps:
      - name: Check the tag is a semantic version
        run: |
          echo "${RELEASE_TAG}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)[0-9]+)?$' \
            || { echo "::error::${RELEASE_TAG} is not a version (0.2.0, 0.2.0-rc1)"; exit 1; }

      - name: Tag the commit this run started from
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > /dev/null 2>&1; then
            echo "${RELEASE_TAG} is already tagged"
          else
            [ "${GITHUB_REF}" = refs/heads/main ] || { echo "::error::a new tag is cut from main; this run started from ${GITHUB_REF_NAME}"; exit 1; }
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${RELEASE_TAG}" -f sha="${GITHUB_SHA}"
          fi

      - name: Check the tag is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${RELEASE_TAG}" --jq .status)"
          case "${status}" in
            identical|behind) ;;
            *) echo "::error::${RELEASE_TAG} points at a commit that is not on main (${status:-unknown})"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Check the crate version matches the tag
        run: |
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          [ "${version}" = "${RELEASE_TAG%%-*}" ] \
            || { echo "::error::Cargo.toml is ${version}, the tag is ${RELEASE_TAG}"; exit 1; }

      - name: Resolve the release notes
        id: notes
        run: |
          path="release-notes/${RELEASE_TAG}.md"
          [ -f "${path}" ] || path="release-notes/${RELEASE_TAG%%-*}.md"
          [ -f "${path}" ] || { echo "::error::no release notes for ${RELEASE_TAG}"; exit 1; }
          echo "path=${path}" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: proot-*
          path: out
          merge-multiple: true

      - name: Classify the tag
        id: kind
        env:
          LATEST: ${{ inputs.latest }}
        run: |
          is_prerelease() { echo "$1" | grep -q -- '-'; }
          case "${LATEST:-auto}" in
            always) latest=true ;;
            never) latest=false ;;
            *) if is_prerelease "${RELEASE_TAG}"; then latest=false; else latest=true; fi ;;
          esac
          prerelease=false
          if [ "${latest}" = false ] && is_prerelease "${RELEASE_TAG}"; then prerelease=true; fi
          { echo "prerelease=${prerelease}"; echo "make_latest=${latest}"; } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ needs.check.outputs.notes }}
          prerelease: ${{ steps.kind.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.kind.outputs.make_latest }}
          files: out/*
